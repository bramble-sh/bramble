name: Release tested
# The first job of every release workflow: waits for CI (ci.yml) to finish on the commit being
# released, and fails unless it passed, so nothing is built, signed or offered for approval from a
# commit CI has not passed. The run it found goes on the release page (scripts/release-evidence.ts,
# docs/ci-releases.md).
#
# Holds no secret and runs only this repository's own script, on Node alone: no dependencies are
# installed beside the token, which can read this repository's runs and nothing else.

on:
  workflow_call:
    outputs:
      evidence:
        description: "The CI run that passed on this commit, as JSON"
        value: ${{ jobs.ci.outputs.evidence }}

permissions: {}

jobs:
  ci:
    name: CI passed
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 75
    outputs:
      evidence: ${{ steps.wait.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for CI on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-evidence.ts wait-for-ci "$GITHUB_SHA"
