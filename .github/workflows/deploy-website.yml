name: Deploy website (Cloudflare Pages)

# Builds the static Astro site and deploys website/dist to Cloudflare Pages with
# `wrangler pages deploy` (Cloudflare's GitHub integration is not used). Needs two
# repo secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  - the target account's ID
# The Pages project (name from website/wrangler.jsonc: bramble-website) must exist.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/theme/**"
      - ".github/workflows/deploy-website.yml"
  # A release switches help text that was waiting for it: the build reads which release tags
  # contain each gated commit (website/README.md, "Text that waits for a release").
  workflow_run:
    workflows: [Desktop release, Chrome release, Firefox release, Android release, iOS TestFlight]
    types: [completed]
  workflow_dispatch:

# Deploy latest; supersede an in-flight run.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the gated text depends on which releases contain a commit, and
          # the build refuses a shallow clone rather than guess.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vault/website build
      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @vault/website exec wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Where gated help text stands
        run: |
          { echo '```'; node scripts/docs-gates.ts; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
