# Checks, every day, that what users get is what the source says (docs/reproducible-builds.md,
# docs/update-transparency.md):
#
# - Rebuilds the extension each store is serving right now, and the newest Android and desktop
#   (Linux) releases, from their tags and compares them with the store's package and the GitHub
#   release.
# - Reads the Sigsum logs for anything signed with Bramble's desktop release keys that is not a
#   published release.
#
# Both scripts need only network, so anyone can run them, and a failure here is for the maintainer
# to explain in public.

name: Verify releases

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "A release to rebuild instead of what is current (e.g. 1.37.0-firefox, 0.19.0-desktop)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extension:
    name: Rebuild ${{ matrix.target }}
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags: the build is of the tag the store's version names.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild what the store serves and compare
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/verify-release.ts --live "$TARGET"

  android:
    name: Rebuild android
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild the newest release and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.ts --live android

  desktop:
    name: Rebuild desktop (Linux ${{ matrix.arch }})
    if: ${{ !inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild the newest release and compare
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: node scripts/verify-release.ts --live desktop --arch "$ARCH"

  tag:
    name: Rebuild ${{ inputs.tag }}
    if: ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild the tag and compare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.ts "$TAG"

  sigsum:
    name: Monitor the Sigsum logs
    runs-on: ubuntu-24.04
    # Up to a 30-minute wait: a release logs its artifacts minutes before it publishes them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Every entry under Bramble's keys is a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sigsum-monitor.ts --grace 30
